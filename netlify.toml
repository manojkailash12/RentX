[build]
  publish = "dist"
  command = "cd netlify/functions && npm install && cd ../.. && npm install && npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp", "canvas", "bcrypt", "@sparticuz/chromium", "puppeteer-core", "cloudinary", "multer-storage-cloudinary"]

# Scheduled function for account deletion (runs every minute)
[functions."scheduled-deletion"]
  schedule = "* * * * *"  # Every minute

# Function-specific settings
[functions."api"]
  timeout = 26  # Maximum timeout for analytics and complex operations

[dev]
  command = "vite"
  port = 8888
  targetPort = 5173
  publish = "dist"
  functions = "netlify/functions"
  framework = "#custom"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

